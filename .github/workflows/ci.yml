name: ML Pipeline

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:

  ml_pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: |
          pytest

      - name: Train model
        run: |
          python src/credit_risk_ml/train.py

      - name: Validate model
        run: |
          python src/credit_risk_ml/validate_model.py

      - name: Promote model
        if: success()
        run: |
          python src/credit_risk_ml/set_alias.py